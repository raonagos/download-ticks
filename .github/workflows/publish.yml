name: Publish

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run cargo publish --dry-run without uploading"
        required: true
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Must match the environment configured in crates.io Trusted Publishing.
    environment: crates-io
    env:
      CARGO_TERM_COLOR: always
      # Optional bootstrap path. If this secret is unset, the workflow uses
      # crates.io Trusted Publishing through GitHub OIDC instead.
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}

    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Verify tag matches Cargo.toml
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          if [[ "$tag" != "$version" ]]; then
            echo "::error::Tag v$tag does not match Cargo.toml version $version"
            exit 1
          fi
          echo "Releasing version $version"

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --release --locked

      - name: Package
        run: cargo package --locked

      - name: Authenticate with crates.io
        id: auth
        if: ${{ env.DRY_RUN == 'false' && env.CARGO_REGISTRY_TOKEN == '' }}
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6

      - name: Export trusted publishing token
        if: ${{ steps.auth.outputs.token != '' }}
        shell: bash
        run: printf 'CARGO_REGISTRY_TOKEN=%s\n' "${{ steps.auth.outputs.token }}" >> "$GITHUB_ENV"

      - name: Publish
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$DRY_RUN" == "true" ]]; then
            cargo publish --dry-run --locked
          else
            cargo publish --locked
          fi
